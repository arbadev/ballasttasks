# Copy .env.example to .env, set AI__API_KEY (or explicitly select fake), then:
# `docker compose up --build`.
# Every value comes from .env (interpolation for compose itself, env_file for the API image).
# Only web (3000) and api (8000) are published to the host; db and redis stay on the
# compose network, where services reach each other by service name.
name: ballasttasks

# One image serves the api and the worker (build context apps/api); the build cache makes
# the second build a no-op.
x-api-image: &api-image
  build:
    context: apps/api
  image: ballasttasks-api
  env_file: .env

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      # PostgreSQL 18+ images keep PGDATA in a version-specific directory under this mount.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10.1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *api-image
    # Migrations are an explicit step before the server starts; the app never runs them itself.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --no-proxy-headers
    ports:
      - "8000:8000"
    environment:
      # The mount below decides where the attachments live in the container, so the API is
      # told the same path rather than being left to its own default: a .env that predates
      # attachments would otherwise write beside the code, where the volume is not and the
      # non-root user may not create directories. Setting it in .env moves the variable and
      # the mount together, but not the permissions: the server runs as uid 1001, and only
      # a directory the image itself creates and owns is writable, so another path also
      # needs its own line in apps/api/Dockerfile. It is not a value one can simply change.
      STORAGE__LOCAL_DIRECTORY: ${STORAGE__LOCAL_DIRECTORY:-/var/lib/ballasttasks/attachments}
    volumes:
      - attachments-data:${STORAGE__LOCAL_DIRECTORY:-/var/lib/ballasttasks/attachments}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The slim Python image ships neither curl nor wget.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *api-image
    command: celery -A app.worker worker --loglevel=INFO
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: apps/web
      args:
        # NEXT_PUBLIC_* values are inlined into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set in .env}
        NEXT_PUBLIC_SERVICE_MODE: ${NEXT_PUBLIC_SERVICE_MODE:-http}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  attachments-data:
