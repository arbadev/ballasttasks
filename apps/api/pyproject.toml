[project]
name = "ballasttasks-api"
version = "0.1.0"
description = "Task management REST API (Clean Architecture, FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "ASYNC", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
# S608: test SQL is assembled from constants in tests/postgres.py, never from input.
"tests/**" = ["S101", "S105", "S106", "S608"]
# ASYNC240: these tests look at the disk the adapter wrote to; blocking there is the point.
"tests/unit/test_local_disk_file_storage.py" = ["ASYNC240"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not live' --strict-markers"
markers = [
    "integration: needs real PostgreSQL and Redis (run with `uv run pytest -m integration`)",
    "live: calls a real third party and is skipped without its credentials: an AI provider (AI__PROVIDER and AI__API_KEY, spends tokens) or Google sign-in (SSO__GOOGLE_CLIENT_ID and SSO__GOOGLE_CLIENT_SECRET); run with `uv run pytest -m live`",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports nothing (no other layer, no framework)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application", "app.infrastructure", "app.api", "app.bootstrap", "app.main",
    "fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy", "celery", "redis",
    "jwt", "argon2", "httpx", "cryptography",
]

[[tool.importlinter.contracts]]
name = "application imports only domain (no framework)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure", "app.api", "app.bootstrap", "app.main",
    "fastapi", "starlette", "pydantic", "pydantic_settings", "sqlalchemy", "celery", "redis",
    "jwt", "argon2", "httpx", "cryptography",
]

[[tool.importlinter.contracts]]
name = "api does not import infrastructure adapters or the composition root"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = [
    "app.infrastructure", "app.bootstrap", "app.main",
    "pydantic_settings", "sqlalchemy", "celery", "redis", "jwt", "argon2", "httpx", "cryptography",
]

[[tool.importlinter.contracts]]
name = "infrastructure does not import api or the composition root"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.api", "app.bootstrap", "app.main", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "only app.bootstrap imports app.infrastructure (main goes through bootstrap)"
type = "forbidden"
source_modules = ["app.main"]
forbidden_modules = ["app.infrastructure"]
allow_indirect_imports = true
